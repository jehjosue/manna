name: Manna
options:
  bundleIdPrefix: app.manna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Manna:
    type: application
    platform: iOS
    sources:
      - path: Manna
      - path: Shared
    dependencies:
      - target: MannaWidget
        embed: true
    entitlements:
      path: Manna/Manna.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.security.application-groups:
          - group.app.manna.ios
        com.apple.developer.icloud-container-identifiers:
          - iCloud.app.manna.ios
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Manna
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "O Manna usa o microfone para você ler versículos em voz alta nos exercícios de fala."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "O Manna reconhece sua voz para conferir a leitura dos versículos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "O Manna precisa de permissão para salvar suas conquistas e retrospectiva como imagens na Fotos."
        INFOPLIST_KEY_GKGameCenterBadgingDisabled: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: night olive light
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  MannaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MannaWidget
      - path: Shared
    entitlements:
      path: MannaWidget/MannaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.manna.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.manna.ios.widget
        INFOPLIST_FILE: MannaWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Manna:
    build:
      targets:
        Manna: all
        MannaWidget: all
    run:
      config: Debug
      storeKitConfiguration: Manna/Resources/Manna.storekit
